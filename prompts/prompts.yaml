# AEO/GEO Research Observatory — Query Set v1
# 54 canonical queries across three zones + 5 stability-test variants = 59 total
# Locked for first run. Any future changes must be versioned and noted in METHODOLOGY.md.
#
# Fields:
#   id          — unique slug, lowercase, hyphens only; used as query_id in SQLite
#   zone        — "content-operations" | "b2b-saas-fintech" | "aeo-geo"
#   topic       — human-readable label used in reports
#   prompt      — exact text sent verbatim to all three engines; no templating
#   query_type  — commercial | informational | comparison | how-to | navigational
#   is_variant  — false for canonical queries; true for stability-test rewording variants
#   variant_of  — null unless is_variant=true; must match a canonical query id
#   notes       — optional; never sent to engines

